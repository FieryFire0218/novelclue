<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelClue - Guess the Novel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">📚</div>
        <div>
          <p class="eyebrow">Web novel guessing game</p>
          <h1>NovelClue</h1>
        </div>
      </div>
      <button id="resetBtn" class="secondary-btn" type="button">Reset</button>
    </header>

    <section class="panel">
      <form method="get" action="{{ url_for('index') }}" class="actions">
        <label>Language <select name="language">{% for code, label in languages.items() %}<option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
        <label>Game <select name="difficulty"><option value="normal" {% if difficulty == 'normal' %}selected{% endif %}>Daily (normal)</option><option value="hard" {% if difficulty == 'hard' %}selected{% endif %}>Hard challenge</option></select></label>
        <button class="secondary-btn">Play</button>
      </form>
      {% if difficulty == 'normal' %}
      <p class="subtitle">{{ languages[lang] }} daily puzzle · {{ day.isoformat() }} UTC</p>
      <form method="get" class="actions">
        <input type="hidden" name="language" value="{{ lang }}">
        <label>Saved puzzles <select name="day">{% for d in dates %}<option {% if d == day %}selected{% endif %}>{{ d.isoformat() }}</option>{% endfor %}</select></label>
        <button class="secondary-btn">Open</button>
      </form>
      {% else %}
      <p class="subtitle">{{ languages[lang] }} hard challenge · <a href="{{ url_for('index', language=lang, difficulty='hard', previous=params['round']) }}">New round</a></p>
      {% endif %}

      <form action="{{ url_for('guess', **params) }}" method="post" id="guessForm" class="guess-form" autocomplete="off">
        <label class="sr-only" for="guessInput">Novel title</label>
        <input type="text" id="guessInput" placeholder="Enter novel title..." list="novelOptions" aria-label="Novel title">
        <datalist id="novelOptions">
          {% for title in novels %}
            <option value="{{ title }}">
          {% endfor %}
        </datalist>
        <button id="guessBtn" class="primary-btn" type="submit">Guess</button>
      </form>

      <div class="actions">
        <button id="hintBtn" class="secondary-btn" type="button">Show hint</button>
        <button data-answer-url="{{ url_for('get_answer', **params) }}" id="giveUpBtn" class="danger-btn" type="button">Give up</button>
      </div>

      <ol id="hints" aria-live="polite"></ol>
      <div id="statusMessage" class="status-message" aria-live="polite"></div>
      <div id="results" class="results" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const guessForm = document.getElementById("guessForm");
    const inputEl = document.getElementById("guessInput");
    const resultsDiv = document.getElementById("results");
    const statusEl = document.getElementById("statusMessage");
    const guessBtn = document.getElementById("guessBtn");
    const giveUpBtn = document.getElementById("giveUpBtn");
    const resetBtn = document.getElementById("resetBtn");

    function gameUrl(path) {
      const url = new URL(path, window.location.origin);
      const query = new URLSearchParams(window.location.search);
      for (const key of ["language", "difficulty", "round", "day"]) {
        if (query.has(key)) url.searchParams.set(key, query.get(key));
      }
      const savedDay = document.querySelector('select[name="day"] option[selected]');
      if (savedDay && !url.searchParams.has("day")) {
        url.searchParams.set("day", savedDay.value);
      }
      return url;
    }

    let hasGivenUp = false;
    let hasWon = false;

    function setStatus(message, tone = "info") {
      statusEl.textContent = message;
      statusEl.className = "status-message " + tone;
    }

    function clearStatus() {
      statusEl.textContent = "";
      statusEl.className = "status-message";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function displayValue(value) {
      return value == null || String(value).trim() === "" ? "Unknown" : escapeHtml(value);
    }

    function renderResultCard(title, bodyHtml, tone = "neutral") {
      resultsDiv.insertAdjacentHTML(
        "afterbegin",
        `
          <article class="result-card ${tone}">
            <h3>${escapeHtml(title)}</h3>
            <div>${bodyHtml}</div>
          </article>
        `
      );
    }

    function renderGuess(title, data) {
      let table = resultsDiv.querySelector(".guess-table");

      if (!table) {
        const wrapper = document.createElement("div");
        wrapper.className = "guess-table-scroll";
        wrapper.tabIndex = 0;
        wrapper.setAttribute("role", "region");
        wrapper.setAttribute("aria-label", "Guess comparisons");

        wrapper.innerHTML = `
          <table class="guess-table">
            <caption class="sr-only">
              Your guesses and comparison clues
            </caption>
            <thead>
              <tr>
                <th scope="col">Novel</th>
                <th scope="col">Author</th>
                <th scope="col">Genres</th>
                <th scope="col">Rating</th>
                <th scope="col">Status</th>
                <th scope="col">Chapters</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        `;

        resultsDiv.appendChild(wrapper);
        table = wrapper.querySelector("table");
      }

      const genres = data.genres;
      const genreText = genres.available
        ? genres.summary + " · " +
          (genres.matched.join(", ") || "No shared genres")
        : genres.summary;

      const values = [
        title,
        data.author,
        genreText,
        data.rating.summary,
        data.publication_status,
        data.chapters
      ];

      const row = document.createElement("tr");

      values.forEach((value, index) => {
        const cell = document.createElement(index === 0 ? "th" : "td");

        if (index === 0) {
          cell.scope = "row";
        }

        cell.textContent = value ?? "Unknown";

        if (index > 0) {
          const text = String(value ?? "").toLowerCase();

          if (/unknown|unavailable/.test(text)) {
            cell.className = "clue-unknown";
          } else if (text.includes("✔")) {
            cell.className = "clue-match";
          }
        }

        row.appendChild(cell);
      });

      table.tBodies[0].prepend(row);
    }

    function renderStars(v) {
      if (v == null || !Number.isFinite(Number(v))) return "Unknown";
      const r5 = Math.max(0, Math.min(5, Math.round(Number(v) * 2) / 2));
      const full = Math.floor(r5);
      const half = (r5 - full) >= 0.5;
      return "★".repeat(full) + (half ? "½" : "") || "0 stars";
    }

    function formatChapters(answer) {
      const total = answer.original_chapters_total;
      const main = answer.original_chapters_main;
      const extra = answer.original_chapters_extra;
      const parts = [];
      if (main != null) parts.push(`${displayValue(main)} main`);
      if (extra != null) parts.push(`${displayValue(extra)} extras`);
      const count = total == null ? "Total unknown" : `${displayValue(total)} chapters`;
      return count + (parts.length ? ` · ${parts.join(" + ")}` : "");
    }

    function formatPublication(answer) {
      const labels = {completed: "Completed", ongoing: "Ongoing", hiatus: "Hiatus",
        dropped: "Dropped", cancelled: "Cancelled", unknown: "Unknown"};
      const overall = labels[answer.publication_status] || "Unknown";
      const main = labels[answer.main_publication_status] || "Unknown";
      return overall + (main !== "Unknown" && main !== overall ? ` · Main story: ${main}` : "");
    }

    const hintBtn = document.getElementById("hintBtn");
    const hintList = document.getElementById("hints");
    let hintRequest = 0;
    let clues = null;

    hintBtn.addEventListener("click", async () => {
      const requestId = ++hintRequest;
      hintBtn.disabled = true;
      try {
        if (clues === null) {
          const response = await fetch(gameUrl("/hint"));
          if (!response.ok) throw new Error("Hint unavailable");
          const data = await response.json();
          if (requestId !== hintRequest || hasGivenUp || hasWon) return;
          clues = data.hints;
        }
        if (!clues.length) {
          setStatus("No hints are available for this puzzle.");
          return;
        }
        const li = document.createElement("li");
        li.textContent = clues[hintList.children.length];
        hintList.appendChild(li);
        hintBtn.disabled = hintList.children.length >= clues.length;
        hintBtn.textContent = hintBtn.disabled ? "All hints shown" : "Next hint";
      } catch {
        if (requestId !== hintRequest || hasGivenUp || hasWon) return;
        setStatus("Could not load the hint. You can try again.", "error");
        hintBtn.disabled = false;
      }
    });

    function lockGame() {
      hintBtn.disabled = true;
      inputEl.disabled = true;
      guessBtn.disabled = true;
      giveUpBtn.disabled = true;
    }

    function unlockGame() {
      inputEl.disabled = false;
      guessBtn.disabled = false;
      giveUpBtn.disabled = false;
    }

    function resetGame() {
      hintRequest++;
      hintList.replaceChildren();
      hintBtn.textContent = "Show hint";
      hintBtn.disabled = false;
      clues = null;
      hasGivenUp = false;
      hasWon = false;
      resultsDiv.innerHTML = "";
      clearStatus();
      inputEl.value = "";
      unlockGame();
      inputEl.focus();
    }

    guessForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (hasGivenUp || hasWon) {
        setStatus("The game is over. Reset to play again.", "error");
        return;
      }

      const title = inputEl.value.trim();
      if (!title) {
        setStatus("Please enter a novel title.", "error");
        inputEl.focus();
        return;
      }

      try {
        const res = await fetch(gameUrl("/guess"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title })
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          setStatus(data.error || "Could not check your guess.", "error");
          inputEl.value = "";
          inputEl.focus();
          return;
        }

        if (data.title === "🎉 Correct!") {
          renderResultCard(
            "Correct guess",
            `<p><strong>${escapeHtml(title)}</strong> was the answer.</p>`,
            "success"
          );
          setStatus("You got it!", "success");
          hasWon = true;
          lockGame();
        } else {
          renderGuess(title, data);
          setStatus("Try another title.", "info");
        }

        inputEl.value = "";
        inputEl.focus();
      } catch (error) {
        setStatus("Something went wrong while checking your guess.", "error");
      }
    });

    async function revealAnswer() {
      if (hasGivenUp || hasWon) {
        setStatus("This round is already finished.", "error");
        return;
      }

      try {
        const res = await fetch(gameUrl("/answer"));
        const ans = await res.json();
        if (!res.ok || ans.error) {
          setStatus(ans.error || "Could not load the answer.", "error");
          return;
        }

        renderResultCard(
          "Answer",
          `<p><strong>Title:</strong> ${displayValue(ans.title)}</p>
           <p><strong>Author:</strong> ${displayValue(ans.author)}</p>
          <p><strong>Genres:</strong> ${
            escapeHtml((ans.genres || [])
              .filter(g => typeof g === "string" && !["chinese", "korean"].includes(g.trim().toLowerCase()))
              .join(", ") || "Genre data unavailable")
          }</p>
           <p><strong>NovelUpdates rating:</strong> ${renderStars(ans.rating5)}</p>
           <p><strong>Publication status:</strong> ${formatPublication(ans)}</p>
           <p><strong>Original chapters:</strong> ${formatChapters(ans)}</p>`,
          "warning"
        );

        setStatus(`The answer was ${ans.title}.`, "warning");
        hasGivenUp = true;
        lockGame();
      } catch (error) {
        setStatus("Could not load the answer right now.", "error");
      }
    }

    giveUpBtn.addEventListener("click", revealAnswer);
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
